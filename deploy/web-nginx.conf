server {
    listen 4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /web-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /readyz {
        proxy_pass http://api:8080/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
        # The OIDC callback query contains a short-lived authorization code.
        access_log off;
        error_log /dev/null;
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
