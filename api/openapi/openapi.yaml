      responses:
        "200": { $ref: "#/components/responses/GoalOK" }
        "400": { $ref: "#/components/responses/GoalBadRequest" }
        "401": { $ref: "#/components/responses/GoalUnauthorized" }
        "403": { $ref: "#/components/responses/GoalForbidden" }
        "404": { $ref: "#/components/responses/GoalNotFound" }
        "500": { $ref: "#/components/responses/GoalInternalError" }
        "503": { $ref: "#/components/responses/GoalUnavailable" }
  /api/v1/goals/{goalID}/items:
    post:
      tags: [Goals]
      summary: Add a checklist item to an active, incomplete Goal
      operationId: addGoalItem
      security: [{ sessionCookie: [] }]
