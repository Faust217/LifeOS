components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lifeos_session
  parameters:
    EventIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong quoted positive decimal event_revision. No wildcard, weak tag or list. Frozen in the v2 fingerprint; stale revision fails 412.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    LegacyEventIfMatch:
      name: If-Match
      in: header
      required: false
      description: Required for every NEW Void/Delete command (428 otherwise). May be omitted only to replay an already committed v9 v1 key with its original payload. A new-key Delete of an already-deleted owned event remains a 204 no-op.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    FinancialIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one cryptographically random lowercase UUIDv4 for this logical Save, retained with the frozen payload across uncertain retries. Scoped to the authenticated owner across all seven covered writes; never expire/evict successful keys. Missing/invalid key fails 400; changed committed intent fails 409.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    MoneyAccountID:
      in: path
      name: accountID
      required: true
      schema: { type: string, format: uuid }
    MoneyCategoryID:
      in: path
      name: categoryID
      required: true
      schema: { type: string, format: uuid }
    MoneyEventID:
      in: path
      name: eventID
      required: true
      schema: { type: string, format: uuid }
    MoneyOrigin:
      in: header
      name: Origin
      required: true
      description: Must exactly match the configured public origin.
      schema: { type: string, format: uri }
    MoneyCSRF:
      in: header
      name: X-CSRF-Token
      required: true
      description: Session-bound token returned by GET /api/v1/me.
      schema: { type: string }
    MoneyCurrencyQuery:
      in: query
      name: currency
      required: true
      schema: { $ref: "#/components/schemas/MoneyCurrency" }
    MoneyLimit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    MoneyOffset:
      in: query
      name: offset
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    GoalID:
      in: path
      name: goalID
      required: true
      schema: { type: string, format: uuid }
    GoalItemID:
      in: path
      name: itemID
      required: true
      schema: { type: string, format: uuid }
  responses:
    EventRevisionRequired:
      description: event_revision_required; read current event before a new command. No mutation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    EventRevisionConflict:
      description: event_revision_conflict; current visible event changed. Preserve draft and review fresh state. No mutation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    FinancialWriteReplay:
      description: Original command committed; no reapplication or prior financial contents. Refresh normal authorized reads because the record may subsequently have changed or disappeared. Private/no-store.
      headers:
        Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyCommittedReplay" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FinancialWriteReplay" }
    FinancialWriteUnavailable:
      description: Bounded busy/rollback (financial_write_busy), uncertain commit (financial_write_outcome_unknown), unsupported fingerprint version, or session validation unavailable. Keep and manually retry the SAME key and frozen body; do not infer that an earlier attempt rolled back.
      headers:
        Retry-After:
          description: Present as 1 for financial_write_busy; absent when no retry delay can be promised.
          schema: { type: string, const: "1" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    GoalOK:
      description: Owner-scoped Goal and current checklist progress.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Goal" }
    GoalCreated:
      description: Goal or checklist item created; current Goal returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Goal" }
    GoalBadRequest:
      description: Malformed JSON, invalid input or identifier, or client owner override.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalUnauthorized:
      description: Missing, expired, revoked, or disabled-user session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalForbidden:
      description: Origin or CSRF check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalNotFound:
      description: Record is missing or belongs to another user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalConflict:
      description: Goal is archived or complete, or its checklist is not ready for completion.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalTooLarge:
      description: Request body exceeds the supported size.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalUnsupportedMediaType:
      description: A JSON request body must use application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalInternalError:
      description: Goal operation failed without exposing private storage details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalUnavailable:
      description: Session validation is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    MoneyBadRequest:
      description: Invalid JSON, input, currency, pagination, owner override, or identifier.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyUnauthorized:
      description: Missing, expired, revoked, or disabled-user session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyForbidden:
      description: Origin or CSRF check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyNotFound:
      description: Record is missing or belongs to another user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyConflict:
      description: Account/category is archived or event cannot be changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyTooLarge:
      description: Request body exceeds the supported size.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyUnsupportedMediaType:
      description: A JSON request body must use application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyOverflow:
      description: Minor-unit arithmetic or parsing exceeded signed 64-bit range.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyInternalError:
      description: Money operation failed without exposing private storage details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyUnavailable:
      description: Session validation is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
  headers:
    IdempotencyFirstSuccess:
      description: First committed success. Private/no-store; retain the key until a valid response is received.
      schema: { type: string, const: "false" }
    IdempotencyCommittedReplay:
      description: Previously committed command; acknowledgement contains no old financial contents.
      schema: { type: string, const: "true" }
    IdempotencyReplayed:
      description: false on first committed success; true on the content-free already_applied acknowledgement. All successes are private and no-store.
      schema: { type: string, enum: ["false", "true"] }
    RequestId:
      description: Identifier used to correlate a request with structured server logs.
      schema:
        type: string
        minLength: 1
  schemas:
    FinancialWriteReplay:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, const: already_applied }
    OwnerExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [json, finance_csv] }
        export_version: { type: integer, enum: [1, 2], default: 1, description: "Omitted means v1; dated accounts require explicit v2." }
    LifeOSOwnerExportV2:
      $ref: "../export/lifeos-export-v2.schema.json"
    LifeOSOwnerExport:
      $ref: "../export/lifeos-export-v1.schema.json"
    GoalTitleRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
    GoalCompletionRequest:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        completed: { type: boolean }
    GoalItem:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Goal:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at, completed_count, total_count, items]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        completed_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_count: { type: integer, minimum: 0 }
        total_count: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/GoalItem" }
    GoalsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Goal" }
    GoalErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_input, unsupported_media_type, request_too_large, authentication_required, invalid_origin, invalid_csrf, owner_override, method_not_allowed, session_unavailable, not_found, conflict, internal_error]
            message: { type: string }
    MoneyMinorUnits:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      maxLength: 20
      description: Signed 64-bit integer minor units encoded as decimal text to preserve exactness in JavaScript.
      examples: ["-1500", "0", "1500"]
    MoneyPositiveMinorUnits:
      type: string
      pattern: '^[1-9][0-9]*$'
      maxLength: 19
      description: Positive signed 64-bit integer minor units encoded as decimal text.
      examples: ["1500"]
    MoneyCurrency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Validated ISO 4217 currency code; the service rejects unknown codes.
      examples: [MYR]
    MoneyErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [history_changed, invalid_history_cursor, history_unavailable, history_revision_exhausted, event_revision_required, event_revision_conflict, event_not_editable, idempotency_key_required, invalid_idempotency_key, idempotency_key_conflict, idempotency_capacity_exceeded, financial_write_busy, financial_write_outcome_unknown, idempotency_version_unsupported, invalid_json, invalid_input, unsupported_media_type, request_too_large, authentication_required, invalid_origin, invalid_csrf, owner_override, method_not_allowed, session_unavailable, currency_mismatch, not_found, archived_record, conflict, amount_overflow, internal_error]
            message: { type: string }
    MoneyAccountCreate:
      type: object
      additionalProperties: false
      required: [opening_balance_at, name, type, currency, opening_balance_minor]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [cash, bank, ewallet, savings, credit_card, other] }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        opening_balance_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
        opening_balance_at: { type: string, format: date-time, description: "Explicit confirmed balance instant, no later than server time; saved owner timezone required." }
    MoneyOpeningPreviewRequest:
      type: object
      additionalProperties: false
      required: [opening_balance_at]
      properties:
        opening_balance_at: { type: string, format: date-time }
        opening_balance_minor: { type: string, pattern: '^-?(0|[1-9][0-9]*)$', description: "Omit to suggest preserving the recorded balance." }
    MoneyOpeningConfirmRequest:
      type: object
      additionalProperties: false
      required: [opening_balance_at, opening_balance_minor, balance_revision, acknowledge_change]
      properties:
        opening_balance_at: { type: string, format: date-time }
        opening_balance_minor: { type: string, pattern: '^-?(0|[1-9][0-9]*)$' }
        balance_revision: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        acknowledge_change: { type: boolean, description: "Must be true when the reviewed current balance changes." }
    MoneyOpeningPreview:
      type: object
      additionalProperties: false
      required: [account_id, currency, previous_balance_basis, resulting_balance_basis, opening_balance_at, previous_opening_balance_minor, balance_before_minor, suggested_opening_balance_minor, suggested_representable, chosen_opening_balance_minor, balance_after_minor, balance_change_minor, before_count, before_net_minor, on_or_after_count, on_or_after_net_minor, balance_revision]
      properties:
        account_id: { type: string, format: uuid }
        currency: { type: string }
        opening_balance_at: { type: string, format: date-time }
        previous_balance_basis: { type: string, const: legacy_all_movements }
        resulting_balance_basis: { type: string, const: known_balance_before_instant }
        previous_opening_balance_minor: { type: string }
        balance_before_minor: { type: string }
        suggested_opening_balance_minor: { type: string, description: "Exact integer text; may exceed int64 when suggestion is unavailable." }
        suggested_representable: { type: boolean }
        chosen_opening_balance_minor: { type: [string, "null"] }
        balance_after_minor: { type: [string, "null"] }
        balance_change_minor: { type: [string, "null"], description: "Exact wide difference, not a new stored monetary fact." }
        before_count: { type: integer, minimum: 0 }
        before_net_minor: { type: string }
        on_or_after_count: { type: integer, minimum: 0 }
        on_or_after_net_minor: { type: string }
        balance_revision: { type: string }
    MoneyAccount:
      type: object
      additionalProperties: false
      required: [opening_balance_at, opening_balance_confirmed_at, opening_balance_basis, balance_revision, id, name, type, currency, opening_balance_minor]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [cash, bank, ewallet, savings, credit_card, other] }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        opening_balance_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
        archived_at: { type: string, format: date-time }
        opening_balance_at: { type: [string, "null"], format: date-time }
        opening_balance_confirmed_at: { type: [string, "null"], format: date-time }
        opening_balance_basis: { type: string, enum: [legacy_all_movements, known_balance_before_instant] }
        balance_revision: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
    MoneyAccountsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MoneyAccount" }
    MoneyBalance:
      type: object
      additionalProperties: false
      required: [account_id, currency, amount_minor]
      properties:
        account_id: { type: string, format: uuid }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        amount_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
    MoneyCategoryCreate:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [income, expense] }
    MoneyCategoryRename:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    MoneyCategory:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
        archived_at: { type: string, format: date-time }
    MoneyCategoriesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MoneyCategory" }
    MoneyCategorySpending:
      type: object
      additionalProperties: false
      required: [category_id, currency, amount_minor]
      properties:
        category_id: { type: string, format: uuid }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        amount_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
    MoneyAllocationCreate:
      type: object
      additionalProperties: false
      required: [category_id, amount_minor]
      properties:
        category_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
    MoneyEventEdit:
      oneOf:
        - { $ref: "#/components/schemas/MoneySingleEventEdit" }
        - { $ref: "#/components/schemas/MoneyTransferEdit" }
    MoneySingleEventEdit:
      type: object
      additionalProperties: false
      required: [note, kind, account_id, amount_minor, currency, occurred_at, allocations]
      properties:
        kind: { type: string, enum: [income, expense] }
        account_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        occurred_at: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
        allocations:
          type: array
          description: Explicit empty array means Uncategorized. If nonempty, the positive allocations must sum exactly to amount_minor.
          items: { $ref: "#/components/schemas/MoneyAllocationCreate" }
    MoneyTransferEdit:
      type: object
      additionalProperties: false
      required: [kind, note, from_account_id, to_account_id, amount_minor, currency, occurred_at]
      properties:
        kind: { type: string, const: transfer }
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        occurred_at: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
    MoneyEventCreate:
      type: object
      additionalProperties: false
      required: [kind, account_id, amount_minor, currency, occurred_at, allocations]
      properties:
        kind: { type: string, enum: [income, expense] }
        account_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        occurred_at: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
        allocations:
          type: array
          description: Explicit empty array means Uncategorized. If nonempty, the positive allocations must sum exactly to amount_minor.
          items: { $ref: "#/components/schemas/MoneyAllocationCreate" }
    MoneyTransferCreate:
      type: object
      additionalProperties: false
      required: [from_account_id, to_account_id, amount_minor, currency, occurred_at]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        occurred_at: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
    MoneyMovement:
      type: object
      additionalProperties: false
      required: [id, account_id, amount_minor, currency]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
    MoneyAllocation:
      type: object
      additionalProperties: false
      required: [id, category_id, amount_minor, currency]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
    MoneyEvent:
      type: object
      additionalProperties: false
      required: [event_revision, id, kind, amount_minor, currency, occurred_at, note, status, movements, allocations]
      properties:
        event_revision: { type: string, pattern: "^[1-9][0-9]*$", description: Current optimistic concurrency token; not an export field. }
        id: { type: string, format: uuid }
        kind: { type: string, enum: [income, expense, transfer] }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        occurred_at: { type: string, format: date-time }
        note: { type: string }
        status: { type: string, enum: [posted, voided] }
        voided_at: { type: string, format: date-time }
        void_reason: { type: string }
        movements:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MoneyMovement" }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/MoneyAllocation" }
    MoneyRunningHistoryEvent:
      type: object
      additionalProperties: false
      required: [event_revision, id, kind, amount_minor, currency, occurred_at, note, status, movements, allocations, account_balances]
      properties:
        event_revision: { type: string, pattern: "^[1-9][0-9]*$", description: Current optimistic concurrency token; not an export field. }
        id: { type: string, format: uuid }
        kind: { type: string, enum: [income, expense, transfer] }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        occurred_at: { type: string, format: date-time }
        note: { type: string }
        status: { type: string, enum: [posted, voided] }
        voided_at: { type: string, format: date-time }
        void_reason: { type: string }
        movements:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MoneyMovement" }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/MoneyAllocation" }
        account_balances:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/MoneyHistoryPosition" }
    MoneyHistoryPosition:
      type: object
      additionalProperties: false
      required: [movement_id, account_id, currency, balance_after_minor, basis, unavailable_reason]
      properties:
        movement_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        balance_after_minor:
          type: [string, "null"]
          pattern: '^(0|-?[1-9][0-9]*)$'
          maxLength: 20
          description: Exact signed int64 minor units from the complete ledger; null with an explicit reason.
        basis: { type: string, enum: [anchored, reconstructed_pre_anchor, legacy_unconfirmed] }
        unavailable_reason: { type: [string, "null"], enum: [null, voided, anchor_required, amount_out_of_range] }
    MoneyHistoryAccount:
      type: object
      additionalProperties: false
      required: [id, name, currency, archived_at, balance_basis, opening_balance_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        archived_at: { type: [string, "null"], format: date-time }
        balance_basis: { type: string, enum: [legacy_all_movements, known_balance_before_instant] }
        opening_balance_at: { type: [string, "null"], format: date-time }
    MoneyHistoryCategory:
      type: object
      additionalProperties: false
      required: [id, name, kind, archived_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
        archived_at: { type: [string, "null"], format: date-time }
    MoneyRunningHistoryResponse:
      type: object
      additionalProperties: false
      required: [projection, history_revision, time_zone, limit, has_more, next_cursor, items, accounts, categories]
      properties:
        projection: { type: string, const: lifeos-running-history-v1 }
        history_revision: { type: string, pattern: '^[0-9a-f]{64}$' }
        time_zone: { type: [string, "null"] }
        limit: { type: integer, minimum: 1, maximum: 100 }
        has_more: { type: boolean }
        next_cursor: { type: [string, "null"], maxLength: 384 }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/MoneyRunningHistoryEvent" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/MoneyHistoryAccount" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/MoneyHistoryCategory" }
    MoneyHistoryResponse:
      type: object
      additionalProperties: false
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MoneyEvent" }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    MoneyVoidRequest:
      type: object
      additionalProperties: false
      description: An omitted, empty, or whitespace-only reason is recorded as no reason provided by the owner; the event remains in history.
      properties:
        reason: { type: string, maxLength: 500 }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, is_owner_admin, csrf_token, time_zone]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        is_owner_admin: { type: boolean }
        csrf_token: { type: string }
        time_zone:
          type: [string, "null"]
          description: Validated IANA timezone, or null until the owner confirms a preference.
          example: Asia/Kuala_Lumpur
    TimezonePreferenceRequest:
      type: object
      additionalProperties: false
      required: [time_zone]
      properties:
        time_zone:
          type: string
          minLength: 3
          maxLength: 100
          description: IANA timezone validated by the server; UTC is also allowed.
          example: Asia/Kuala_Lumpur
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, database, migration]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          $ref: "#/components/schemas/ComponentStatus"
        migration:
          $ref: "#/components/schemas/MigrationStatus"
        error:
          $ref: "#/components/schemas/ErrorStatus"
    ComponentStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
    MigrationStatus:
      type: object
      additionalProperties: false
      required: [status, expected_version, dirty]
      properties:
        status:
          type: string
          enum: [ready, unavailable, unknown, missing, dirty, behind, ahead]
        version:
          type: integer
          minimum: 0
        expected_version:
          type: integer
          minimum: 1
        dirty:
          type: boolean
    ErrorStatus:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - database_unavailable
            - migration_status_unavailable
            - migration_not_ready
            - migration_dirty
        message:
          type: string
          minLength: 1
