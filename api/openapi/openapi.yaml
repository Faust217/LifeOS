openapi: 3.1.0
info:
  title: LifeOS API
  version: 0.1.0
  description: Foundation operations, invite-only Alpha authentication, owner-scoped Money, and checklist Goals.
servers:
  - url: http://127.0.0.1:8080
    description: Default local API
tags:
  - name: Export
    description: Private, complete normal owner-data downloads.
  - name: Operations
    description: Unversioned process and dependency health endpoints.
  - name: Identity
    description: Google sign-in and LifeOS sessions.
  - name: Money
    description: Owner-scoped accounts, categories, and financial events.
  - name: Goals
    description: Owner-scoped, non-financial checklist Goals.
security: []
paths:
  /api/v1/accounts/{accountID}/opening-balance/preview:
    post:
      tags: [Money]
      summary: Preview a dated account balance without changing it
      operationId: previewOpeningBalance
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyAccountID" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyOpeningPreviewRequest" }
      responses:
        "200":
          description: Complete owner-scoped preview with account revision; no database write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyOpeningPreview" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "409": { $ref: "#/components/responses/MoneyConflict" }
        "413": { $ref: "#/components/responses/MoneyTooLarge" }
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "422": { $ref: "#/components/responses/MoneyOverflow" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/accounts/{accountID}/opening-balance/confirm:
    post:
      tags: [Money]
      summary: Confirm a reviewed dated account balance once
      operationId: confirmOpeningBalance
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/FinancialIdempotencyKey" }
        - { $ref: "#/components/parameters/MoneyAccountID" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyOpeningConfirmRequest" }
      responses:
        "200":
          description: First committed confirmation returns the owned Account (replay=false); a matching committed key returns only already_applied (replay=true), before current revision checks. A new key must satisfy current preconditions.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/MoneyAccount" }
                  - { $ref: "#/components/schemas/FinancialWriteReplay" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "409": { $ref: "#/components/responses/MoneyConflict" }
        "413": { $ref: "#/components/responses/MoneyTooLarge" }
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "422": { $ref: "#/components/responses/MoneyOverflow" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/FinancialWriteUnavailable" }
  /api/v1/me/export:
    post:
      tags: [Export]
      summary: Download a complete bounded owner snapshot
      description: >-
        Read-only operation guarded by session, exact Origin and CSRF. No owner or
        pagination inputs. One REPEATABLE READ READ ONLY snapshot; Soft Deleted
        events and dependents are excluded, visible voided history is retained.
        Artifact is completed before response and the same session is revalidated.
        64 MiB raw/output, 120-second generation and write deadlines, one request
        per owner and two per API process. All responses are private/no-store.
      operationId: downloadOwnerExport
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerExportRequest" }
      responses:
        "200":
          description: Completed JSON or Finance CSV ZIP attachment; never a partial artifact.
          headers:
            Content-Disposition:
              description: Attachment with a fixed server-generated UTC filename.
              schema: { type: string }
            Content-Length:
              description: Exact artifact bytes, at most 64 MiB.
              schema: { type: integer, minimum: 1, maximum: 67108864 }
            Cache-Control:
              schema: { type: string, const: "private, no-store, max-age=0" }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/LifeOSOwnerExport" }
                  - { $ref: "#/components/schemas/LifeOSOwnerExportV2" }
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "409":
          description: export_version_incompatible; use explicit v2 for dated account balances.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    type: object
                    additionalProperties: false
                    required: [code, message]
                    properties:
                      code: { type: string, const: export_version_incompatible }
                      message: { type: string }
        "405":
          description: Only POST is supported.
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "422":
          description: export_limit_exceeded; no partial file is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
        "429":
          description: export_busy; per-owner or per-process concurrency slot is occupied.
          headers:
            Retry-After:
              schema: { type: integer, const: 5 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503":
          description: export_timeout, export_unavailable or session_unavailable; retry safely.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
  /api/v1/auth/start:
    get:
      tags: [Identity]
      summary: Start Google sign-in with state, nonce, and PKCE
      operationId: startSignIn
      responses:
        "302":
          description: Redirect to Google authorization with a short-lived state cookie.
        "503":
          description: Sign-in cannot be started.
  /api/v1/auth/callback:
    get:
      tags: [Identity]
      summary: Verify Google OIDC response and issue a LifeOS session
      operationId: finishSignIn
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: code
          required: false
          schema: { type: string }
      responses:
        "303":
          description: Session established; redirect to the web app.
        "400":
          description: Missing, expired, mismatched, or reused sign-in attempt.
        "401":
          description: Google authorization or ID token verification failed.
        "403":
          description: No valid invitation or active user.
        "503":
          description: Session storage unavailable.
  /api/v1/auth/logout:
    post:
      tags: [Identity]
      summary: Revoke the current LifeOS session
      operationId: signOut
      security: [{ sessionCookie: [] }]
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string, format: uri }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Session revoked and cookie cleared.
        "401":
          description: No active session.
        "403":
          description: Origin or CSRF token mismatch.
        "503":
          description: Session storage unavailable.
  /api/v1/me:
    get:
      tags: [Identity]
      summary: Get the current LifeOS user and logout CSRF token
      operationId: getCurrentUser
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Active LifeOS user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401":
          description: No active session.
  /api/v1/me/timezone:
    put:
      tags: [Identity]
      summary: Set the current owner's IANA timezone for transaction dates
      operationId: updateCurrentUserTimezone
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimezonePreferenceRequest" }
      responses:
        "204":
          description: Timezone preference saved; existing UTC events are unchanged.
        "400":
          description: Invalid or unsupported IANA timezone.
        "401":
          description: No active session.
        "403":
          description: Origin or CSRF token mismatch.
        "503":
          description: Session or preference storage unavailable.
  /api/v1/admin/status:
    get:
      tags: [Identity]
      summary: Check owner administrator access
      operationId: getAdminStatus
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Current user is the owner administrator.
        "401":
          description: No active session.
        "403":
          description: Current user is not an owner administrator.
  /api/v1/accounts:
    get:
      tags: [Money]
      summary: List the current user's accounts, including archived accounts
      operationId: listMoneyAccounts
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Owner-scoped accounts; items is an empty array when none exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyAccountsResponse" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
    post:
      tags: [Money]
      summary: Create an account with an explicit opening position
      operationId: createMoneyAccount
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/FinancialIdempotencyKey" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyAccountCreate" }
      responses:
        "200": { $ref: "#/components/responses/FinancialWriteReplay" }
        "201":
          description: Account created.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyFirstSuccess" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyAccount" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "413": { $ref: "#/components/responses/MoneyTooLarge" }
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/FinancialWriteUnavailable" }
        "409": { $ref: "#/components/responses/MoneyConflict" }

  /api/v1/accounts/{accountID}/balance:
    get:
      tags: [Money]
      summary: Read a deterministic account balance
      operationId: getMoneyAccountBalance
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyAccountID" }
      responses:
        "200":
          description: Opening position plus signed movements from posted events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyBalance" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "422": { $ref: "#/components/responses/MoneyOverflow" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/accounts/{accountID}/archive:
    post:
      tags: [Money]
      summary: Archive an account while retaining its history
      operationId: archiveMoneyAccount
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyAccountID" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      responses:
        "204": { description: Account archived. }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/accounts/{accountID}/restore:
    post:
      tags: [Money]
      summary: Restore an archived account without changing its history
      operationId: restoreMoneyAccount
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyAccountID" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      responses:
        "204": { description: Account restored. }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/categories:
    get:
      tags: [Money]
      summary: List the current user's income and expense categories
      operationId: listMoneyCategories
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Owner-scoped categories; items is an empty array when none exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyCategoriesResponse" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
    post:
      tags: [Money]
      summary: Create an income or expense category
      operationId: createMoneyCategory
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyCategoryCreate" }
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyCategory" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "409": { $ref: "#/components/responses/MoneyConflict" }
        "413": { $ref: "#/components/responses/MoneyTooLarge" }
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/categories/{categoryID}/rename:
    post:
      tags: [Money]
      summary: Rename an owned category without changing its kind or historical links
      operationId: renameMoneyCategory
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyCategoryID" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyCategoryRename" }
      responses:
        "200":
          description: Same category ID and kind with its updated name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyCategory" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "409": { $ref: "#/components/responses/MoneyConflict" }
        "413": { $ref: "#/components/responses/MoneyTooLarge" }
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/categories/{categoryID}/archive:
    post:
      tags: [Money]
      summary: Archive a category while preserving all historical allocations
      operationId: archiveMoneyCategory
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyCategoryID" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      responses:
        "204": { description: Category archived; existing allocations remain linked. }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/categories/{categoryID}/restore:
    post:
      tags: [Money]
      summary: Restore an archived category for new transactions
      operationId: restoreMoneyCategory
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyCategoryID" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      responses:
        "204": { description: Category restored without changing its history. }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/categories/{categoryID}/spending:
    get:
      tags: [Money]
      summary: Read posted expense spending in one explicit currency
      operationId: getMoneyCategorySpending
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyCategoryID" }
        - { $ref: "#/components/parameters/MoneyCurrencyQuery" }
      responses:
        "200":
          description: Owner-scoped spending excluding transfers and voided events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyCategorySpending" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "422": { $ref: "#/components/responses/MoneyOverflow" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/events:
    get:
      tags: [Money]
      summary: List owner history with optional running balances and stable pages
      description: >-
        Without view, preserves limit/offset history used by Today. With view=running_balances,
        offset is forbidden. Continuation requires the returned history_revision and cursor
        with the same limit. Unknown or repeated parameters are rejected. Changed Finance data
        or saved timezone returns 409 history_changed; explicitly restart from page one.
        Each response uses one read-only REPEATABLE READ snapshot and private no-store caching.
      operationId: listMoneyEvents
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyLimit" }
        - { $ref: "#/components/parameters/MoneyOffset" }
        - in: query
          name: view
          schema: { type: string, enum: [running_balances] }
        - in: query
          name: history_revision
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - in: query
          name: cursor
          description: Canonical opaque base64url cursor bound to revision and page size; not authorization.
          schema: { type: string, minLength: 1, maxLength: 384 }
      responses:
        "200":
          description: Owner-scoped events, including voided history and child records.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/MoneyHistoryResponse" }
                  - { $ref: "#/components/schemas/MoneyRunningHistoryResponse" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "409": { $ref: "#/components/responses/MoneyConflict" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
    post:
      tags: [Money]
      summary: Post income or expense with explicit allocations or as Uncategorized
      operationId: postMoneyEvent
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/FinancialIdempotencyKey" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyEventCreate" }
      responses:
        "200": { $ref: "#/components/responses/FinancialWriteReplay" }
        "201":
          description: Atomic financial event with its movement and zero or more allocations. An empty allocation array means Uncategorized.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyFirstSuccess" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyEvent" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "409": { $ref: "#/components/responses/MoneyConflict" }
        "413": { $ref: "#/components/responses/MoneyTooLarge" }
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "422": { $ref: "#/components/responses/MoneyOverflow" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/FinancialWriteUnavailable" }
  /api/v1/transfers:
    post:
      tags: [Money]
      summary: Post a same-currency transfer with no spending allocation
      operationId: postMoneyTransfer
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/FinancialIdempotencyKey" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyTransferCreate" }
      responses:
        "200": { $ref: "#/components/responses/FinancialWriteReplay" }
        "201":
          description: Transfer event with equal opposite movements and no allocations.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyFirstSuccess" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyEvent" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "409": { $ref: "#/components/responses/MoneyConflict" }
        "413": { $ref: "#/components/responses/MoneyTooLarge" }
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "422": { $ref: "#/components/responses/MoneyOverflow" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/FinancialWriteUnavailable" }
  /api/v1/events/{eventID}:
    get:
      tags: [Money]
      summary: Read a complete visible event from one consistent snapshot
      operationId: getMoneyEvent
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/MoneyEventID" }]
      responses:
        "200":
          description: Current owned event including complete allocations. Deleted events are not exposed. Private/no-store.
          headers:
            ETag: { description: Strong quoted decimal event revision., schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyEvent" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/MoneyUnavailable" }
  /api/v1/events/{eventID}/edit:
    post:
      tags: [Money]
      summary: Atomically replace editable fields of a posted event with the same ID
      description: Complete payload including every allocation; kind and currency immutable. Same-key committed replay precedes current state checks and returns no old contents. Existing archived associations may be retained; newly selected ones must be active. Snapshot audit is internal and excluded from normal exports.
      operationId: editMoneyEvent
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyEventID" }
        - { $ref: "#/components/parameters/FinancialIdempotencyKey" }
        - { $ref: "#/components/parameters/EventIfMatch" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyEventEdit" }
      responses:
        "200":
          description: Updated event on first success, or content-free already_applied receipt on replay. Private/no-store.
          headers:
            Idempotency-Replayed: { schema: { type: string, enum: ["true", "false"] } }
            ETag: { description: New strong revision on first success only; absent on replay., schema: { type: string } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/MoneyEvent" }
                  - { $ref: "#/components/schemas/FinancialWriteReplay" }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "409": { $ref: "#/components/responses/MoneyConflict" }
        "412": { $ref: "#/components/responses/EventRevisionConflict" }
        "413": { $ref: "#/components/responses/MoneyTooLarge" }
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "422": { $ref: "#/components/responses/MoneyOverflow" }
        "428": { $ref: "#/components/responses/EventRevisionRequired" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/FinancialWriteUnavailable" }
  /api/v1/events/{eventID}/void:
    post:
      tags: [Money]
      description: Required owner-scoped UUIDv4 key; first success has Idempotency-Replayed=false. Matching replay acknowledges the original committed command without financial contents. Different normalized data under a committed key fails 409. All attempts recheck session, Origin and CSRF. See ADR-019.
      summary: Void an event with an optional note while retaining history
      operationId: voidMoneyEvent
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/FinancialIdempotencyKey" }
        - { $ref: "#/components/parameters/LegacyEventIfMatch" }
        - { $ref: "#/components/parameters/MoneyEventID" }
        - { $ref: "#/components/parameters/MoneyOrigin" }
        - { $ref: "#/components/parameters/MoneyCSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyVoidRequest" }
      responses:
        "200": { $ref: "#/components/responses/FinancialWriteReplay" }
        "204": { description: Event voided; history remains available. }
        "400": { $ref: "#/components/responses/MoneyBadRequest" }
        "401": { $ref: "#/components/responses/MoneyUnauthorized" }
        "403": { $ref: "#/components/responses/MoneyForbidden" }
        "404": { $ref: "#/components/responses/MoneyNotFound" }
        "412": { $ref: "#/components/responses/EventRevisionConflict" }
        "428": { $ref: "#/components/responses/EventRevisionRequired" }
        "409": { $ref: "#/components/responses/MoneyConflict" }
        "413": { $ref: "#/components/responses/MoneyTooLarge" }
        "415": { $ref: "#/components/responses/MoneyUnsupportedMediaType" }
        "422": { $ref: "#/components/responses/MoneyOverflow" }
        "500": { $ref: "#/components/responses/MoneyInternalError" }
        "503": { $ref: "#/components/responses/FinancialWriteUnavailable" }
