        "201": { $ref: "#/components/responses/GoalCreated" }
        "400": { $ref: "#/components/responses/GoalBadRequest" }
        "401": { $ref: "#/components/responses/GoalUnauthorized" }
        "403": { $ref: "#/components/responses/GoalForbidden" }
        "404": { $ref: "#/components/responses/GoalNotFound" }
        "409": { $ref: "#/components/responses/GoalConflict" }
        "413": { $ref: "#/components/responses/GoalTooLarge" }
        "415": { $ref: "#/components/responses/GoalUnsupportedMediaType" }
        "500": { $ref: "#/components/responses/GoalInternalError" }
        "503": { $ref: "#/components/responses/GoalUnavailable" }
  /api/v1/goals/{goalID}/items/{itemID}/rename:
    post:
      tags: [Goals]
      summary: Edit a checklist item title
      operationId: renameGoalItem
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/GoalID" }, { $ref: "#/components/parameters/GoalItemID" }, { $ref: "#/components/parameters/MoneyOrigin" }, { $ref: "#/components/parameters/MoneyCSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalTitleRequest" }
      responses:
        "200": { $ref: "#/components/responses/GoalOK" }
        "400": { $ref: "#/components/responses/GoalBadRequest" }
        "401": { $ref: "#/components/responses/GoalUnauthorized" }
        "403": { $ref: "#/components/responses/GoalForbidden" }
        "404": { $ref: "#/components/responses/GoalNotFound" }
        "409": { $ref: "#/components/responses/GoalConflict" }
        "413": { $ref: "#/components/responses/GoalTooLarge" }
        "415": { $ref: "#/components/responses/GoalUnsupportedMediaType" }
        "500": { $ref: "#/components/responses/GoalInternalError" }
        "503": { $ref: "#/components/responses/GoalUnavailable" }
  /api/v1/goals/{goalID}/items/{itemID}/completion:
    post:
      tags: [Goals]
      summary: Complete or uncomplete a checklist item
      operationId: setGoalItemCompletion
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/GoalID" }, { $ref: "#/components/parameters/GoalItemID" }, { $ref: "#/components/parameters/MoneyOrigin" }, { $ref: "#/components/parameters/MoneyCSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalCompletionRequest" }
      responses:
        "200": { $ref: "#/components/responses/GoalOK" }
        "400": { $ref: "#/components/responses/GoalBadRequest" }
        "401": { $ref: "#/components/responses/GoalUnauthorized" }
        "403": { $ref: "#/components/responses/GoalForbidden" }
        "404": { $ref: "#/components/responses/GoalNotFound" }
        "409": { $ref: "#/components/responses/GoalConflict" }
        "413": { $ref: "#/components/responses/GoalTooLarge" }
        "415": { $ref: "#/components/responses/GoalUnsupportedMediaType" }
        "500": { $ref: "#/components/responses/GoalInternalError" }
        "503": { $ref: "#/components/responses/GoalUnavailable" }
  /api/v1/goals/{goalID}/items/{itemID}:
    delete:
      tags: [Goals]
      summary: Remove a checklist item from an active, incomplete Goal
      operationId: removeGoalItem
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/GoalID" }, { $ref: "#/components/parameters/GoalItemID" }, { $ref: "#/components/parameters/MoneyOrigin" }, { $ref: "#/components/parameters/MoneyCSRF" }]
      responses:
        "200": { $ref: "#/components/responses/GoalOK" }
        "400": { $ref: "#/components/responses/GoalBadRequest" }
        "401": { $ref: "#/components/responses/GoalUnauthorized" }
        "403": { $ref: "#/components/responses/GoalForbidden" }
        "404": { $ref: "#/components/responses/GoalNotFound" }
        "409": { $ref: "#/components/responses/GoalConflict" }
        "500": { $ref: "#/components/responses/GoalInternalError" }
        "503": { $ref: "#/components/responses/GoalUnavailable" }
  /healthz:
    get:
      tags: [Operations]
      summary: Report process liveness
      operationId: getHealth
      responses:
        "200":
          description: The API process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [Operations]
      summary: Report PostgreSQL and migration readiness
      operationId: getReadiness
      responses:
        "200":
          description: PostgreSQL is reachable and the migration version is clean and current.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: PostgreSQL or the required migration state is not ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lifeos_session
  parameters:
    MoneyAccountID:
      in: path
      name: accountID
      required: true
      schema: { type: string, format: uuid }
    MoneyCategoryID:
      in: path
      name: categoryID
      required: true
      schema: { type: string, format: uuid }
    MoneyEventID:
      in: path
      name: eventID
      required: true
      schema: { type: string, format: uuid }
    MoneyOrigin:
      in: header
      name: Origin
      required: true
      description: Must exactly match the configured public origin.
      schema: { type: string, format: uri }
    MoneyCSRF:
      in: header
      name: X-CSRF-Token
      required: true
      description: Session-bound token returned by GET /api/v1/me.
      schema: { type: string }
    MoneyCurrencyQuery:
      in: query
      name: currency
      required: true
      schema: { $ref: "#/components/schemas/MoneyCurrency" }
    MoneyLimit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    MoneyOffset:
      in: query
      name: offset
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    GoalID:
      in: path
      name: goalID
      required: true
      schema: { type: string, format: uuid }
    GoalItemID:
      in: path
      name: itemID
      required: true
      schema: { type: string, format: uuid }
  responses:
    GoalOK:
      description: Owner-scoped Goal and current checklist progress.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Goal" }
    GoalCreated:
      description: Goal or checklist item created; current Goal returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Goal" }
    GoalBadRequest:
      description: Malformed JSON, invalid input or identifier, or client owner override.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalUnauthorized:
      description: Missing, expired, revoked, or disabled-user session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalForbidden:
      description: Origin or CSRF check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalNotFound:
      description: Record is missing or belongs to another user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalConflict:
      description: Goal is archived or complete, or its checklist is not ready for completion.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalTooLarge:
      description: Request body exceeds the supported size.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalUnsupportedMediaType:
      description: A JSON request body must use application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalInternalError:
      description: Goal operation failed without exposing private storage details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    GoalUnavailable:
      description: Session validation is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalErrorResponse" }
    MoneyBadRequest:
      description: Invalid JSON, input, currency, pagination, owner override, or identifier.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyUnauthorized:
      description: Missing, expired, revoked, or disabled-user session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyForbidden:
      description: Origin or CSRF check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyNotFound:
      description: Record is missing or belongs to another user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyConflict:
      description: Account/category is archived or event cannot be changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyTooLarge:
      description: Request body exceeds the supported size.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyUnsupportedMediaType:
      description: A JSON request body must use application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyOverflow:
      description: Minor-unit arithmetic or parsing exceeded signed 64-bit range.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyInternalError:
      description: Money operation failed without exposing private storage details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
    MoneyUnavailable:
      description: Session validation is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MoneyErrorResponse" }
  headers:
    RequestId:
      description: Identifier used to correlate a request with structured server logs.
      schema:
        type: string
        minLength: 1
  schemas:
    OwnerExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [json, finance_csv] }
    LifeOSOwnerExport:
      $ref: "../export/lifeos-export-v1.schema.json"
    GoalTitleRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
    GoalCompletionRequest:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        completed: { type: boolean }
    GoalItem:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Goal:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at, completed_count, total_count, items]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        completed_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_count: { type: integer, minimum: 0 }
        total_count: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/GoalItem" }
    GoalsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Goal" }
    GoalErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_input, unsupported_media_type, request_too_large, authentication_required, invalid_origin, invalid_csrf, owner_override, method_not_allowed, session_unavailable, not_found, conflict, internal_error]
            message: { type: string }
    MoneyMinorUnits:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      maxLength: 20
      description: Signed 64-bit integer minor units encoded as decimal text to preserve exactness in JavaScript.
      examples: ["-1500", "0", "1500"]
    MoneyPositiveMinorUnits:
      type: string
      pattern: '^[1-9][0-9]*$'
      maxLength: 19
      description: Positive signed 64-bit integer minor units encoded as decimal text.
      examples: ["1500"]
    MoneyCurrency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Validated ISO 4217 currency code; the service rejects unknown codes.
      examples: [MYR]
    MoneyErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_input, unsupported_media_type, request_too_large, authentication_required, invalid_origin, invalid_csrf, owner_override, method_not_allowed, session_unavailable, currency_mismatch, not_found, archived_record, conflict, amount_overflow, internal_error]
            message: { type: string }
    MoneyAccountCreate:
      type: object
      additionalProperties: false
      required: [name, type, currency, opening_balance_minor]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [cash, bank, ewallet, savings, credit_card, other] }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        opening_balance_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
    MoneyAccount:
      type: object
      additionalProperties: false
      required: [id, name, type, currency, opening_balance_minor]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [cash, bank, ewallet, savings, credit_card, other] }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        opening_balance_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
        archived_at: { type: string, format: date-time }
    MoneyAccountsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MoneyAccount" }
    MoneyBalance:
      type: object
      additionalProperties: false
      required: [account_id, currency, amount_minor]
      properties:
        account_id: { type: string, format: uuid }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        amount_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
    MoneyCategoryCreate:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [income, expense] }
    MoneyCategoryRename:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    MoneyCategory:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
        archived_at: { type: string, format: date-time }
    MoneyCategoriesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MoneyCategory" }
    MoneyCategorySpending:
      type: object
      additionalProperties: false
      required: [category_id, currency, amount_minor]
      properties:
        category_id: { type: string, format: uuid }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        amount_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
    MoneyAllocationCreate:
      type: object
      additionalProperties: false
      required: [category_id, amount_minor]
      properties:
        category_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
    MoneyEventCreate:
      type: object
      additionalProperties: false
      required: [kind, account_id, amount_minor, currency, occurred_at, allocations]
      properties:
        kind: { type: string, enum: [income, expense] }
        account_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        occurred_at: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
        allocations:
          type: array
          description: Explicit empty array means Uncategorized. If nonempty, the positive allocations must sum exactly to amount_minor.
          items: { $ref: "#/components/schemas/MoneyAllocationCreate" }
    MoneyTransferCreate:
      type: object
      additionalProperties: false
      required: [from_account_id, to_account_id, amount_minor, currency, occurred_at]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        occurred_at: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
    MoneyMovement:
      type: object
      additionalProperties: false
      required: [id, account_id, amount_minor, currency]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
    MoneyAllocation:
      type: object
      additionalProperties: false
      required: [id, category_id, amount_minor, currency]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
    MoneyEvent:
      type: object
      additionalProperties: false
      required: [id, kind, amount_minor, currency, occurred_at, note, status, movements, allocations]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [income, expense, transfer] }
        amount_minor: { $ref: "#/components/schemas/MoneyPositiveMinorUnits" }
        currency: { $ref: "#/components/schemas/MoneyCurrency" }
        occurred_at: { type: string, format: date-time }
        note: { type: string }
        status: { type: string, enum: [posted, voided] }
        voided_at: { type: string, format: date-time }
        void_reason: { type: string }
        movements:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MoneyMovement" }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/MoneyAllocation" }
    MoneyHistoryResponse:
      type: object
      additionalProperties: false
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MoneyEvent" }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    MoneyVoidRequest:
      type: object
      additionalProperties: false
      description: An omitted, empty, or whitespace-only reason is recorded as no reason provided by the owner; the event remains in history.
      properties:
        reason: { type: string, maxLength: 500 }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, is_owner_admin, csrf_token, time_zone]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        is_owner_admin: { type: boolean }
        csrf_token: { type: string }
        time_zone:
          type: [string, "null"]
          description: Validated IANA timezone, or null until the owner confirms a preference.
          example: Asia/Kuala_Lumpur
    TimezonePreferenceRequest:
      type: object
      additionalProperties: false
      required: [time_zone]
      properties:
        time_zone:
          type: string
          minLength: 3
          maxLength: 100
          description: IANA timezone validated by the server; UTC is also allowed.
          example: Asia/Kuala_Lumpur
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, database, migration]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          $ref: "#/components/schemas/ComponentStatus"
        migration:
          $ref: "#/components/schemas/MigrationStatus"
        error:
          $ref: "#/components/schemas/ErrorStatus"
    ComponentStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
    MigrationStatus:
      type: object
      additionalProperties: false
      required: [status, expected_version, dirty]
      properties:
        status:
          type: string
          enum: [ready, unavailable, unknown, missing, dirty, behind, ahead]
        version:
          type: integer
          minimum: 0
        expected_version:
          type: integer
          minimum: 1
        dirty:
          type: boolean
    ErrorStatus:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - database_unavailable
            - migration_status_unavailable
            - migration_not_ready
            - migration_dirty
        message:
          type: string
          minLength: 1
